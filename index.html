<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaiboards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
:root{--bg:#141211;--fg:#ece6dd;--mute:#a39a8f;--amber:#e0a458;--line:#35302b;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left,0px))}
h1{font:800 clamp(48px,9vw,96px)/.9 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;margin:0 0 8px}
p{color:var(--mute);margin:0 0 32px}
a.board{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}
a.board img{width:120px;aspect-ratio:3/4;object-fit:cover;border-radius:3px}
a.board b{display:block;font:800 30px/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
a.board span{font:500 12px "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:.08em;text-transform:uppercase}
a.board:hover b{color:var(--amber)}
</style></head><body><main>
<h1>Kaiboards</h1>
<p>Shoot mood boards and lighting plans by Kai Visuals, Bengaluru.</p>
<a class="board" href="balaji/"><img src="balaji/img/b2a.jpg" alt=""><div><span>Nov 2026 · Gym, physique &amp; gi</span><b>Balaji</b>17 looks — gym, physique and gi — with camera settings and light plans</div></a>
</main></body></html>
